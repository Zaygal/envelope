name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # Formatting is REPORTED but NOT GATED, deliberately.
      #
      # `forge fmt` wants to collapse the manually aligned struct fields and
      # event signatures in src/PayrollRun.sol. That file is frozen: it is the
      # source of the contract deployed at
      # 0x28e0B1b15ec9fE95d2c75DF6a27CcB70A07dA83B, and Solidity embeds a
      # metadata hash derived from source content into the bytecode. Reformatting
      # it would change that hash and break the bytecode-identity claim in
      # README.md — the one property this repository exists to demonstrate.
      #
      # So the diff stays visible in the log for anyone reviewing the code, and
      # `forge build` + `forge test` remain the gates that actually fail the run.
      - name: Run Forge fmt (reported, not gated — see comment)
        run: forge fmt --check
        continue-on-error: true

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
